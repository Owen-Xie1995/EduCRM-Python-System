name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: educrm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      EDUCRM_TEST_MYSQL: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: educrm_test
      DB_USER: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
